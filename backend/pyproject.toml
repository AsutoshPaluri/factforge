[project]
name = "factforge"
version = "0.1.0"
description = "Multimodal fact-checking agent with evidence-grounded NLI verification"
requires-python = ">=3.12"
authors = [{ name = "Asutosh Paluri" }]
license = { text = "MIT" }
dependencies = [
    # Web framework
    "fastapi[standard]>=0.115.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",

    # Agent orchestration
    "langgraph>=0.2.50",

    # LLM
    "google-genai>=0.4.0",
    "groq>=0.13.0",

    # NLI (transformers + torch + tokenizer deps)
    "transformers>=4.46.0",
    "torch>=2.5.0",
    "accelerate>=1.0.0",
    "sentencepiece>=0.2.0",
    "protobuf>=5.0.0",

    # Search & web retrieval
    "ddgs>=6.0.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "trafilatura>=1.12.0",
    "lxml>=5.0.0",

    # Database
    "supabase>=2.10.0",

    # Caching / rate limiting
    "redis>=5.2.0",

    # Observability
    "langfuse>=2.55.0",
    "structlog>=24.4.0",
    "sentry-sdk[fastapi]>=2.18.0",

    # Utils
    "tenacity>=9.0.0",
    "python-multipart>=0.0.18",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "pyright>=1.1.385",
]

[build-system]
requires = ["uv_build>=0.11.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP", "RUF", "SIM", "ARG"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "S101"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
pythonVersion = "3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: tests that load large ML models or hit slow external services",
]
